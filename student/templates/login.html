{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block body %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow p-4" style="width: 350px; border-radius: 15px;">
        <h3 class="text-center mb-4">Login</h3>
<style>
        body {
            background-color: #144eaaff; 
        }
    </style>
        {% load socialaccount %}
        <!-- Google Login -->
        <a href="{% provider_login_url 'google' %}?next=/dashboard" class="btn btn-light border mb-3 w-100" style="display:flex; align-items:center; justify-content:center; gap:8px;">
            <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" width="20">
            Login with Google
        </a>

        <div class="text-center text-muted mb-3">or</div>

        <!-- Email Login Form -->
         
        <form method="POST" action="">
            {% csrf_token %}
            <div class="mb-3">
                <input type="username" name="username" class="form-control" placeholder="username" required  autocomplete="username">
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn w-100" style="background: linear-gradient(to right, #4caf50, #2196f3); color: white;">
                Login 
            </button>
        </form>
    </div>
</div>
{% endblock body %}
